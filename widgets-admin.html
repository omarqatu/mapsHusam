            try {

                       JSON.parse(localStorage.getItem('user')) ||
                       JSON.parse(sessionStorage.getItem('user'));

<script>
// ==========================================================================
// إعدادات عامة
// ==========================================================================
function getAdminAuthHeaders() {
    try {
        const raw = localStorage.getItem('map_user') || sessionStorage.getItem('map_user') ||
                    localStorage.getItem('user') || sessionStorage.getItem('user');
        if (raw) {
            const u = JSON.parse(raw);
            if (u.admin_token) return { 'Authorization': 'Bearer ' + u.admin_token };
        }
    } catch (e) {}
    return {};
}

function showAlert(message, type) {
    const container = document.getElementById('alert-container');
    const el = document.createElement('div');
    el.className = 'alert alert-' + (type || 'success');
    el.innerHTML = message;
    container.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.remove(); }, 5000);
}

function formatDate(dateStr) {
    if (!dateStr) return 'لا يوجد تحديث بعد';
    let normalized = String(dateStr).trim().replace(' ', 'T').replace(/(\.\d{3})\d+/, '$1');
    const d = new Date(normalized);
    if (isNaN(d.getTime())) return 'غير معروف';
    return d.toLocaleString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

let uidCounter = 0;
function nextUid() { return 'row-' + (++uidCounter); }

// 🆕 جعل صفوف أي جدول قابلة للسحب لإعادة الترتيب
function makeTableRowsDraggable(tbody) {
    if (!tbody) return;
    let draggedRow = null;
    tbody.querySelectorAll('tr').forEach(row => {
        row.setAttribute('draggable', 'true');
        row.style.cursor = 'grab';
        row.addEventListener('dragstart', () => {
            draggedRow = row;
            row.style.opacity = '0.4';
        });
        row.addEventListener('dragend', () => { row.style.opacity = ''; });
        row.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!draggedRow || row === draggedRow) return;
            const rect = row.getBoundingClientRect();
            const isAfter = (e.clientY - rect.top) > rect.height / 2;
            isAfter ? row.after(draggedRow) : row.before(draggedRow);
        });
    });
}

// 🆕 حفظ ترتيب حواجز الطرق بعد السحب
async function saveRoadOrder() {
    const rows = document.querySelectorAll('#panel-road_status tbody tr');
    const orderedIds = Array.from(rows).map(r => parseInt(r.dataset.featureId, 10));
    try {
        const res = await fetch('/api/admin/reorder-features', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ layer: 'road_barriers', orderedIds })
        });
        const data = await res.json();
        showAlert(data.success ? '✅ تم حفظ ترتيب الحواجز بنجاح' : '❌ ' + (data.error || 'فشل الحفظ'), data.success ? 'success' : 'error');
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// 🆕 حفظ ترتيب محطات الوقود بعد السحب
async function saveFuelOrder() {
    const rows = document.querySelectorAll('#panel-fuel_status tbody tr');
    const orderedIds = Array.from(rows).map(r => parseInt(r.dataset.featureId, 10));
    try {
        const res = await fetch('/api/admin/reorder-features', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ layer: 'fuel_stations', orderedIds })
        });
        const data = await res.json();
        showAlert(data.success ? '✅ تم حفظ ترتيب المحطات بنجاح' : '❌ ' + (data.error || 'فشل الحفظ'), data.success ? 'success' : 'error');
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

    { id: 'ramallah', label: 'رام الله', temp: 28, humidity: 65, wind: 12, condition: 'غائم جزئياً' },
    { id: 'gaza', label: 'غزة', temp: 32, humidity: 70, wind: 15, condition: 'مشمس' },

// حالة محلية: صفوف كل مجموعة JSON + قوائم المعالم
let groupsState = {};      // { currency: {items:[...rows with _uid], updated_at}, ... }
let roadBarriersState = [];
let fuelStationsState = [];
let roadStatusUpdatedAt = null;
let fuelStatusUpdatedAt = null;

// ==========================================================================
// بناء التبويبات
// ==========================================================================
const TAB_ORDER = [
    ...Object.keys(JSON_GROUPS),
    'road_status',
    'fuel_status'
];
const TAB_META = {
    ...Object.fromEntries(Object.entries(JSON_GROUPS).map(([k, v]) => [k, { title: v.title, icon: v.icon }])),
    road_status: { title: 'حالة الطرق', icon: 'fa-road' },
    fuel_status: { title: 'حالة محطات الوقود', icon: 'fa-gas-pump' }
};

function buildTabsBar() {
    const bar = document.getElementById('tabs-bar');
    bar.innerHTML = '';
    TAB_ORDER.forEach((key, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.dataset.tab = key;
        btn.innerHTML = `<i class="fas ${TAB_META[key].icon}"></i> ${TAB_META[key].title}`;
        btn.onclick = () => setActiveTab(key);
        bar.appendChild(btn);
    });
}

function setActiveTab(key) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
}

function buildPanelsSkeleton() {
    const container = document.getElementById('panels-container');
    container.innerHTML = '';
    TAB_ORDER.forEach((key, i) => {
        const panel = document.createElement('div');
        panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
        panel.id = 'panel-' + key;
        panel.innerHTML = '<div class="loading-line"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
        container.appendChild(panel);
    });
}

// ==========================================================================
// تحميل البيانات
// ==========================================================================
async function loadEverything() {
    buildTabsBar();
    buildPanelsSkeleton();

    try {
        const [adminGroupsRes, publicRes, featuresRes] = await Promise.all([
            fetch('/api/admin/widgets-data', { headers: getAdminAuthHeaders() }),
            fetch('/api/widgets-data'),
            fetch('/api/admin/road-fuel-features', { headers: getAdminAuthHeaders() })
        ]);

        const adminGroupsData = await adminGroupsRes.json();
        const publicData = await publicRes.json();
        const featuresData = await featuresRes.json();

        if (!adminGroupsData.success) throw new Error(adminGroupsData.error || 'فشل جلب المجموعات');
        if (!featuresData.success) throw new Error(featuresData.error || 'فشل جلب المعالم');

                // 🆕 [إصلاح الفراغ الأولي]: خريطة الافتراضيات لكل مجموعة - الطقس له
        // مصدر خاص (DEFAULT_WEATHER_ITEMS أعلاه)، وباقي المجموعات تُؤخذ مباشرة
        // من نفس WIDGETS_MANUAL_DATA المُحمَّل من widgets-config.js
        const DEFAULT_GROUP_ITEMS = {
            weather: DEFAULT_WEATHER_ITEMS
        };

        groupsState = {};
        Object.keys(JSON_GROUPS).forEach(key => {
            const serverGroup = adminGroupsData.groups[key] || { data: [] };
            let items = Array.isArray(serverGroup.data) ? serverGroup.data : [];

            
            if (items.length === 0) {
                const fallback = DEFAULT_GROUP_ITEMS[key] || (typeof WIDGETS_MANUAL_DATA !== 'undefined' ? WIDGETS_MANUAL_DATA[key] : null);
                if (Array.isArray(fallback)) items = fallback;
            }

            groupsState[key] = {
                updated_at: serverGroup.updated_at || null,
                items: items.map(it => ({ ...it, _uid: nextUid() }))
            };
        });

        roadBarriersState = (featuresData.roadBarriers || []).map(f => ({ ...f, _uid: nextUid() }));
        fuelStationsState = (featuresData.fuelStations || []).map(f => ({ ...f, _uid: nextUid() }));
        roadStatusUpdatedAt = publicData.road_status_updated_at || null;
        fuelStatusUpdatedAt = publicData.fuel_status_updated_at || null;

        renderAllPanels();
    } catch (err) {
        console.error(err);
        document.getElementById('panels-container').innerHTML =
            '<div class="no-data">تعذر تحميل بيانات مركز المعلومات الحية: ' + err.message + '</div>';
    }
}

function renderAllPanels() {
    Object.keys(JSON_GROUPS).forEach(renderJsonGroupPanel);
    renderRoadStatusPanel();
    renderFuelStatusPanel();
}

// ==========================================================================
// عرض/تعديل مجموعة JSON عامة (عملات/ذهب/طقس/وقود/نقل)
// ==========================================================================
function renderJsonGroupPanel(groupKey) {
    const meta = JSON_GROUPS[groupKey];
    const state = groupsState[groupKey];
    const panel = document.getElementById('panel-' + groupKey);

    const fieldsHtml = meta.fields.map(f => `<th>${f.label}</th>`).join('');

        const rowsHtml = state.items.map(item => `
        <tr data-uid="${item._uid}">
            <td style="cursor:grab; color:#999; width:30px;">⋮⋮</td>
            ${meta.fields.map(f => `
                <td>
                    <input type="${f.type === 'date' ? 'date' : 'text'}" data-field="${f.key}" placeholder="${f.placeholder || ''}"
                           value="${(item[f.key] !== undefined && item[f.key] !== null) ? String(item[f.key]).replace(/"/g, '&quot;') : ''}">
                </td>
            `).join('')}
        <td><button type="button" class="btn btn-danger btn-sm btn-remove-json-row" data-group="${groupKey}" data-uid="${item._uid}"><i class="fas fa-trash"></i></button></td>
        </tr>
    `).join('');

    panel.innerHTML = `
        <div class="panel-header">
            <h2><i class="fas ${meta.icon}"></i> ${meta.title}</h2>
            <span class="last-updated-badge" id="last-updated-${groupKey}">
                <i class="fas fa-clock"></i> آخر تحديث: ${formatDate(state.updated_at)}
            </span>
        </div>
        <p style="font-size:12px; color:#888; margin:0 0 8px;"><i class="fas fa-arrows-alt-v"></i> اسحب أيقونة ⋮⋮ لإعادة ترتيب الصفوف، ثم اضغط "حفظ تعديلات هذه المجموعة".</p>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th style="width:30px;"></th>${fieldsHtml}<th style="width:60px;">حذف</th></tr></thead>

function removeJsonRow(groupKey, uid) {

async function saveJsonGroup(groupKey) {

    const tbody = document.getElementById('tbody-' + groupKey);
    const rows = tbody ? Array.from(tbody.querySelectorAll('tr')) : [];

    const items = [];

            if (val !== '') obj[key] = val;
        });

            method: 'POST',

            showAlert('❌ ' + (data.error || 'فشل الحفظ'), 'error');

// ==========================================================================
// حالة الطرق (حواجز) - تعديل حالة معالم موجودة فقط
// ==========================================================================
// ==========================================================================
// 🆕 مساعدات مشتركة: قوائم الحالة + التحديد الجماعي (حواجز الطرق / محطات الوقود)
// ==========================================================================
// قائمة حالة داخل صف الجدول. allowUnset: إذا كانت القيمة الحالية فارغة (لم تُدخل بعد)
// يظهر خيار "غير محدد" بدل عرض أول خيار بالخطأ كأنه القيمة المحفوظة.
function buildStatusSelect(elemId, options, currentVal, allowUnset) {
    const hasVal = currentVal !== null && currentVal !== undefined && String(currentVal) !== '';
    const unsetOpt = (allowUnset && !hasVal) ? '<option value="" selected>— غير محدد —</option>' : '';
    const opts = options.map(o =>
        `<option value="${o.value}" ${hasVal && String(currentVal) === o.value ? 'selected' : ''}>${o.label}</option>`
    ).join('');
    return `<select id="${elemId}">${unsetOpt}${opts}</select>`;
}

// قائمة حالة للشريط الجماعي (الخيار الافتراضي "بدون تغيير")
function buildBulkSelect(elemId, options) {
    return `<select id="${elemId}"><option value="">— بدون تغيير —</option>` +
        options.map(o => `<option value="${o.value}">${o.label}</option>`).join('') +
        `</select>`;
}

function setSelectValue(elemId, val, markSaved) {
    const el = document.getElementById(elemId);
    if (!el) return;
    el.value = String(val);
    if (markSaved) el.dataset.initial = String(val); // القيمة صارت محفوظة بقاعدة البيانات
}

const BULK_GROUPS = {
    road: { panelId: 'panel-road_status', countId: 'bulk-count-road', dirtyId: 'dirty-count-road' },
    fuel: { panelId: 'panel-fuel_status', countId: 'bulk-count-fuel', dirtyId: 'dirty-count-fuel' }
};

function getCheckedFeatureIds(group) {
    const cfg = BULK_GROUPS[group];
    if (!cfg) return [];
    return Array.from(document.querySelectorAll('#' + cfg.panelId + ' tbody .bulk-row-check:checked'))
        .map(cb => parseInt(cb.closest('tr').dataset.featureId, 10))
        .filter(n => !isNaN(n));
}

function updateBulkCount(group) {
    const cfg = BULK_GROUPS[group];
    if (!cfg) return;
    const panel = document.getElementById(cfg.panelId);
    if (!panel) return;
    const all = panel.querySelectorAll('tbody .bulk-row-check');
    const checked = panel.querySelectorAll('tbody .bulk-row-check:checked');
    const countEl = document.getElementById(cfg.countId);
    if (countEl) countEl.textContent = checked.length;
    const headerCb = panel.querySelector('.bulk-select-all');
    if (headerCb) {
        headerCb.checked = all.length > 0 && checked.length === all.length;
        headerCb.indeterminate = checked.length > 0 && checked.length < all.length;
    }
}

// تحديث شارة "آخر تحديث" في مكانها بعد أي حفظ (بدون إعادة رسم اللوحة كاملة)
async function refreshStatusTimestamps() {

// ==========================================================================
// 🆕 تتبع التعديلات غير المحفوظة + "حفظ الكل"
// كل قائمة داخل جدول الطرق/الوقود تحفظ قيمتها المحفوظة الأخيرة في data-initial،
// وأي قائمة تختلف قيمتها الحالية عنها تعتبر "معدَّلة" (يظهر صفها بلون مميز).
// ==========================================================================
const SAVE_ALL_FIELDS = {
    road: [['stop', 'stop-select-'], ['stop2', 'stop2-select-']],
    fuel: [['diesel', 'fuel-diesel-'], ['banzen95', 'fuel-banzen95-'], ['banzen98', 'fuel-banzen98-']]
};

function isSelectDirty(sel) {
    return sel.dataset.initial !== undefined && sel.value !== '' && sel.value !== sel.dataset.initial;
}

function markInitialValues(group) {
    const cfg = BULK_GROUPS[group];
    if (!cfg) return;
    document.querySelectorAll('#' + cfg.panelId + ' tbody select').forEach(s => { s.dataset.initial = s.value; });
    syncDirtyState(group);
}

function commitRowInitials(row) {
    if (!row) return;
    row.querySelectorAll('select').forEach(s => { s.dataset.initial = s.value; });
}

function syncDirtyState(group) {
    const cfg = BULK_GROUPS[group];
    if (!cfg) return 0;
    const panel = document.getElementById(cfg.panelId);
    if (!panel) return 0;
    let dirtyRows = 0;
    panel.querySelectorAll('tbody tr').forEach(row => {
        const dirty = Array.from(row.querySelectorAll('select')).some(isSelectDirty);
        row.classList.toggle('row-dirty', dirty);
        if (dirty) dirtyRows++;
    });
    const badge = document.getElementById(cfg.dirtyId);
    if (badge) {
        badge.textContent = dirtyRows > 0 ? ('⚠️ تعديلات غير محفوظة: ' + dirtyRows) : '';
        badge.style.display = dirtyRows > 0 ? 'inline-flex' : 'none';
    }
    return dirtyRows;
}

function hasUnsavedChanges() {
    return document.querySelectorAll('#panel-road_status tr.row-dirty, #panel-fuel_status tr.row-dirty').length > 0;
}

// يجمع فقط الصفوف المعدَّلة، وفي كل صف فقط القيم التي تغيّرت فعلاً
function collectDirtyItems(group) {
    const cfg = BULK_GROUPS[group];
    const fields = SAVE_ALL_FIELDS[group];
    const items = [];
    if (!cfg || !fields) return items;
    document.querySelectorAll('#' + cfg.panelId + ' tbody tr').forEach(row => {
        const uid = row.dataset.uid;
        const id = parseInt(row.dataset.featureId, 10);
        if (isNaN(id)) return;
        const item = { id };
        let any = false;
        fields.forEach(pair => {
            const sel = document.getElementById(pair[1] + uid);
            if (sel && isSelectDirty(sel)) { item[pair[0]] = sel.value; any = true; }
        });
        if (any) items.push(item);
    });
    return items;
}

function setSaveAllButtonsDisabled(group, disabled) {
    document.querySelectorAll('.btn-save-all-' + group).forEach(b => { b.disabled = disabled; });
}

async function saveAllGroup(group) {
    const isRoad = group === 'road';
    const items = collectDirtyItems(group);
    if (items.length === 0) {
        showAlert('ℹ️ لا توجد تعديلات غير محفوظة.', 'info');
        return;
    }

    setSaveAllButtonsDisabled(group, true);
    try {
        const res = await fetch(isRoad ? '/api/admin/batch-update-road-barriers' : '/api/admin/batch-update-fuel-stations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ items })
        });
        const data = await res.json();
        if (!data.success) {
            showAlert('❌ ' + (data.error || 'فشل الحفظ') + ' — لم يُحفظ أي تعديل.', 'error');
            return;
        }

        const stateList = isRoad ? roadBarriersState : fuelStationsState;
        const cfg = BULK_GROUPS[group];
        items.forEach(item => {
            const st = stateList.find(f => String(f.id) === String(item.id));
            if (st) SAVE_ALL_FIELDS[group].forEach(pair => { if (item[pair[0]] !== undefined) st[pair[0]] = item[pair[0]]; });
            const row = document.querySelector('#' + cfg.panelId + ' tbody tr[data-feature-id="' + item.id + '"]');
            commitRowInitials(row);
        });
        syncDirtyState(group);
        showAlert('✅ تم حفظ ' + items.length + (isRoad ? ' حاجز' : ' محطة') + ' دفعة واحدة.', 'success');
        refreshStatusTimestamps();
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    } finally {
        setSaveAllButtonsDisabled(group, false);
    }
}

async function saveRoadBarrier(id, uid) {
    const stop = document.getElementById('stop-select-' + uid).value;
    const stop2 = document.getElementById('stop2-select-' + uid).value;

    // القيمة الفارغة (غير محدد) لا تُرسل ولا تُغيَّر في قاعدة البيانات
    const payload = { id };
    if (stop !== '') payload.stop = stop;
    if (stop2 !== '') payload.stop2 = stop2;
    if (stop === '' && stop2 === '') {
        showAlert('⚠️ اختر حالة للداخل و/أو للخارج قبل الحفظ.', 'error');
        return;
    }

    try {
        const res = await fetch('/api/admin/update-road-barrier', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            showAlert('✅ تم تحديث حالة الحاجز بنجاح.', 'success');
            const st = roadBarriersState.find(f => String(f.id) === String(id));
            if (st) {
                if (stop !== '') st.stop = stop;
                if (stop2 !== '') st.stop2 = stop2;
            }
            commitRowInitials(document.getElementById('stop-select-' + uid).closest('tr'));
            syncDirtyState('road');
            refreshStatusTimestamps();
        } else {
            showAlert('❌ ' + (data.error || 'فشل التحديث'), 'error');
        }
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// 🆕 تطبيق حالة واحدة على كل الحواجز المحددة (أو كلها إذا اختير "تحديد الكل")
async function applyBulkRoad() {
    const ids = getCheckedFeatureIds('road');
    if (ids.length === 0) {
        showAlert('⚠️ حدّد حاجزاً واحداً على الأقل (أو استخدم مربع "تحديد الكل").', 'error');
        return;
    }
    const stop = document.getElementById('bulk-road-stop').value;
    const stop2 = document.getElementById('bulk-road-stop2').value;
    if (stop === '' && stop2 === '') {
        showAlert('⚠️ اختر حالة "للداخل" و/أو "للخارج" لتطبيقها على الحواجز المحددة.', 'error');
        return;
    }

    const labelOf = (val) => (ROAD_STOP_OPTIONS.find(o => o.value === val) || {}).label || val;
    const parts = [];
    if (stop !== '') parts.push('للداخل: ' + labelOf(stop));
    if (stop2 !== '') parts.push('للخارج: ' + labelOf(stop2));
    if (!confirm('سيتم تعديل ' + ids.length + ' حاجز (' + parts.join(' | ') + ').\nهل تريد المتابعة؟')) return;

    const payload = { ids };
    if (stop !== '') payload.stop = stop;
    if (stop2 !== '') payload.stop2 = stop2;

    try {
        const res = await fetch('/api/admin/bulk-update-road-barriers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.success) {
            showAlert('❌ ' + (data.error || 'فشل التحديث الجماعي'), 'error');
            return;
        }

        // تحديث الواجهة والحالة المحلية مباشرة بدون إعادة رسم (حتى لا تضيع تعديلات غير محفوظة بصفوف أخرى)
        ids.forEach(id => {
            const st = roadBarriersState.find(f => String(f.id) === String(id));
            if (st) {
                if (stop !== '') st.stop = stop;
                if (stop2 !== '') st.stop2 = stop2;
            }
            const row = document.querySelector('#panel-road_status tbody tr[data-feature-id="' + id + '"]');
            if (!row) return;
            const uid = row.dataset.uid;
            if (stop !== '') setSelectValue('stop-select-' + uid, stop, true);
            if (stop2 !== '') setSelectValue('stop2-select-' + uid, stop2, true);
            const cb = row.querySelector('.bulk-row-check');
            if (cb) cb.checked = false;
        });
        document.getElementById('bulk-road-stop').value = '';
        document.getElementById('bulk-road-stop2').value = '';
        updateBulkCount('road');
        syncDirtyState('road');
        showAlert('✅ تم تحديث ' + (data.updated !== undefined ? data.updated : ids.length) + ' حاجز بنجاح.', 'success');
        refreshStatusTimestamps();
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

            <small style="color:#666;">حدّد المحطات من المربعات (أو "تحديد الكل" من رأس الجدول) ثم اختر التوفر واضغط تطبيق. "بدون تغيير" يترك ذلك النوع كما هو.</small>
        </div>

        <div style="overflow-x:auto;">
            <table>
                <thead><tr>
                    <th style="width:30px;"></th>
                    <th style="width:40px;"><input type="checkbox" class="bulk-select-all" data-group="fuel" title="تحديد الكل"></th>
                    <th style="width:80px;">ID</th>
                    <th>اسم المحطة</th>
                    <th>سولار/ديزل</th>
                    <th>بنزين 95</th>
                    <th>بنزين 98</th>
                    <th style="width:100px;">حفظ</th>
                </tr></thead>
                <tbody>${rowsHtml || ''}</tbody>
            </table>
        </div>
        ${fuelStationsState.length === 0 ? '<div class="no-data">لا توجد محطات وقود مسجّلة بعد</div>' : ''}
        <div class="table-actions">
            <button type="button" class="btn btn-success btn-save-all-fuel"><i class="fas fa-save"></i> حفظ الكل</button>
            <button type="button" class="btn btn-success btn-save-fuel-order"><i class="fas fa-arrows-alt-v"></i> حفظ الترتيب</button>
            <button type="button" class="btn btn-primary btn-reload-everything"><i class="fas fa-sync-alt"></i> تحديث القائمة</button>
        </div>
    `;
    makeTableRowsDraggable(panel.querySelector('tbody'));
    markInitialValues('fuel');
}

async function saveFuelStation(id, uid) {
    const diesel = document.getElementById('fuel-diesel-' + uid).value;
    const banzen95 = document.getElementById('fuel-banzen95-' + uid).value;
    const banzen98 = document.getElementById('fuel-banzen98-' + uid).value;
    try {
        const res = await fetch('/api/admin/update-fuel-station', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ id, diesel, banzen95, banzen98 })
        });
        const data = await res.json();
        if (data.success) {
            showAlert('✅ تم تحديث توفر الوقود لهذه المحطة بنجاح.', 'success');
            const st = fuelStationsState.find(f => String(f.id) === String(id));
            if (st) { st.diesel = diesel; st.banzen95 = banzen95; st.banzen98 = banzen98; }
            commitRowInitials(document.getElementById('fuel-diesel-' + uid).closest('tr'));
            syncDirtyState('fuel');
            refreshStatusTimestamps();
        } else {
            showAlert('❌ ' + (data.error || 'فشل التحديث'), 'error');
        }
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// 🆕 تطبيق توفر وقود واحد على كل المحطات المحددة (أو كلها إذا اختير "تحديد الكل")
async function applyBulkFuel() {
    const ids = getCheckedFeatureIds('fuel');
    if (ids.length === 0) {
        showAlert('⚠️ حدّد محطة واحدة على الأقل (أو استخدم مربع "تحديد الكل").', 'error');
        return;
    }

    const fields = [
        { key: 'diesel', label: 'سولار/ديزل' },
        { key: 'banzen95', label: 'بنزين 95' },
        { key: 'banzen98', label: 'بنزين 98' }
    ];
    const payload = { ids };
    const parts = [];
    fields.forEach(f => {
        const val = document.getElementById('bulk-fuel-' + f.key).value;
        if (val !== '') {
            payload[f.key] = val;
            const opt = FUEL_AVAIL_OPTIONS.find(o => o.value === val);
            parts.push(f.label + ': ' + (opt ? opt.label : val));
        }
    });
    if (parts.length === 0) {
        showAlert('⚠️ اختر توفر نوع وقود واحد على الأقل لتطبيقه على المحطات المحددة.', 'error');
        return;
    }
    if (!confirm('سيتم تعديل ' + ids.length + ' محطة (' + parts.join(' | ') + ').\nهل تريد المتابعة؟')) return;

    try {
        const res = await fetch('/api/admin/bulk-update-fuel-stations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.success) {
            showAlert('❌ ' + (data.error || 'فشل التحديث الجماعي'), 'error');
            return;
        }

        ids.forEach(id => {
            const st = fuelStationsState.find(f => String(f.id) === String(id));
            const row = document.querySelector('#panel-fuel_status tbody tr[data-feature-id="' + id + '"]');
            const uid = row ? row.dataset.uid : null;
            fields.forEach(f => {
                if (payload[f.key] === undefined) return;
                if (st) st[f.key] = payload[f.key];
                if (uid) setSelectValue('fuel-' + f.key + '-' + uid, payload[f.key], true);
            });
            if (row) {
                const cb = row.querySelector('.bulk-row-check');
                if (cb) cb.checked = false;
            }
        });
        fields.forEach(f => { document.getElementById('bulk-fuel-' + f.key).value = ''; });
        updateBulkCount('fuel');
        syncDirtyState('fuel');
        showAlert('✅ تم تحديث ' + (data.updated !== undefined ? data.updated : ids.length) + ' محطة بنجاح.', 'success');
        refreshStatusTimestamps();
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// ==========================================================================
// 🆕 [تشديد أمني CSP]: تفويض حدث نقر واحد على مستوى #panels-container يغطي
// كل الأزرار المولّدة ديناميكياً بكل التبويبات (تُعاد كتابتها بالكامل عند كل
// render)، بدل onclick inline بكل زر على حدة
// ==========================================================================
document.getElementById('panels-container').addEventListener('click', (e) => {
    const removeBtn = e.target.closest('.btn-remove-json-row');
    if (removeBtn) { removeJsonRow(removeBtn.dataset.group, removeBtn.dataset.uid); return; }

    const addBtn = e.target.closest('.btn-add-json-row');
    if (addBtn) { addJsonRow(addBtn.dataset.group); return; }

    const saveGroupBtn = e.target.closest('.btn-save-json-group');
    if (saveGroupBtn) { saveJsonGroup(saveGroupBtn.dataset.group); return; }

    const reloadBtn = e.target.closest('.btn-reload-everything');
    if (reloadBtn) {
        if (hasUnsavedChanges() && !confirm('توجد تعديلات غير محفوظة وستضيع عند تحديث القائمة. هل تريد المتابعة؟')) return;
        loadEverything();
        return;
    }

    const saveRoadBtn = e.target.closest('.btn-save-road-barrier');
    if (saveRoadBtn) { saveRoadBarrier(parseInt(saveRoadBtn.dataset.id, 10), saveRoadBtn.dataset.uid); return; }

    const saveRoadOrderBtn = e.target.closest('.btn-save-road-order');
    if (saveRoadOrderBtn) { saveRoadOrder(); return; }

    const saveFuelBtn = e.target.closest('.btn-save-fuel-station');
    if (saveFuelBtn) { saveFuelStation(parseInt(saveFuelBtn.dataset.id, 10), saveFuelBtn.dataset.uid); return; }

    const saveFuelOrderBtn = e.target.closest('.btn-save-fuel-order');
    if (saveFuelOrderBtn) { saveFuelOrder(); return; }

    const bulkRoadBtn = e.target.closest('.btn-bulk-apply-road');
    if (bulkRoadBtn) { applyBulkRoad(); return; }

    const bulkFuelBtn = e.target.closest('.btn-bulk-apply-fuel');
    if (bulkFuelBtn) { applyBulkFuel(); return; }

    const saveAllRoadBtn = e.target.closest('.btn-save-all-road');
    if (saveAllRoadBtn) { saveAllGroup('road'); return; }

    const saveAllFuelBtn = e.target.closest('.btn-save-all-fuel');
    if (saveAllFuelBtn) { saveAllGroup('fuel'); return; }
});

// 🆕 تفويض حدث change لمربعات التحديد (تحديد الكل + مربع كل صف) وتحديث عدّاد المحدد
document.getElementById('panels-container').addEventListener('change', (e) => {
    // تغيير أي قائمة حالة داخل جدول الطرق/الوقود => تحديث تمييز الصفوف غير المحفوظة
    if (e.target.tagName === 'SELECT' && e.target.closest('tbody')) {
        const owner = e.target.closest('.tab-panel');
        if (owner && owner.id === 'panel-road_status') syncDirtyState('road');
        else if (owner && owner.id === 'panel-fuel_status') syncDirtyState('fuel');
        return;
    }
    const selectAll = e.target.closest('.bulk-select-all');
    if (selectAll) {
        const group = selectAll.dataset.group;
        const cfg = BULK_GROUPS[group];
        if (!cfg) return;
        document.querySelectorAll('#' + cfg.panelId + ' tbody .bulk-row-check').forEach(cb => { cb.checked = selectAll.checked; });
        updateBulkCount(group);
        return;
    }
    if (e.target.classList && e.target.classList.contains('bulk-row-check')) {
        updateBulkCount(e.target.dataset.group);
    }
});

// ==========================================================================
// بدء التشغيل
// ==========================================================================
loadEverything();
</script>
