name: Deploy to IIS Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Gate: the same checks CI runs on branches, executed in the runner's workspace BEFORE anything is copied. A red
      # check stops the job here, so a broken `main` never replaces the running site.
      - name: Check - install web dependencies
        shell: cmd
        working-directory: web
        run: npm ci

      - name: Check - typecheck
        shell: cmd
        working-directory: web
        run: npm run typecheck

      - name: Check - lint
        shell: cmd
        working-directory: web
        run: npm run lint

      - name: Check - unit tests
        shell: cmd
        working-directory: web
        run: npm test

      - name: Check - build
        shell: cmd
        working-directory: web
        run: npm run build

      - name: Copy files to web folder
        shell: cmd
        run: |
          robocopy "%GITHUB_WORKSPACE%" "C:\inetpub\wwwroot\psm\mapsHusam" /MIR /XD .git .github node_modules DB_Backups GeoServerData /XF .gitignore
          if %ERRORLEVEL% LEQ 7 (exit 0) else (exit 1)

      - name: Install dependencies
        shell: cmd
        working-directory: C:\inetpub\wwwroot\psm\mapsHusam
        run: npm ci

      # The React app (web/) is built on the server after the copy: web/dist is not in git, and the copy above
      # mirrors the folder, so the build has to come after it and before the restart (server.js reads web/dist at start).
      - name: Install web dependencies
        shell: cmd
        working-directory: C:\inetpub\wwwroot\psm\mapsHusam\web
        run: npm ci

      - name: Build web app
        shell: cmd
        working-directory: C:\inetpub\wwwroot\psm\mapsHusam\web
        run: npm run build

      - name: Restart app
        shell: cmd
        run: |
          net stop mapsHusam
          net start mapsHusam
