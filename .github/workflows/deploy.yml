name: Deploy to IIS Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Gate: install and validate both halves in the checkout before production is touched. These installed dependencies
      # and web/dist become the staged release, so no install/build step can fail after the production copy starts.
      - name: Check - install server dependencies
        shell: cmd
        run: npm ci

      - name: Check - server modules
        shell: cmd
        run: npm run check:server

      - name: Check - server unit tests
        shell: cmd
        run: npm test

      - name: Check - production backup prerequisites
        shell: powershell
        run: >-
          & "$env:GITHUB_WORKSPACE\tools\deploy-windows.ps1"
          -DeployPath "C:\inetpub\wwwroot\psm\mapsHusam"
          -ServiceName "mapsHusam"
          -PreflightOnly

      - name: Check - install web dependencies
        shell: cmd
        working-directory: web
        run: npm ci

      - name: Check - typecheck
        shell: cmd
        working-directory: web
        run: npm run typecheck

      - name: Check - lint
        shell: cmd
        working-directory: web
        run: npm run lint

      - name: Check - unit tests
        shell: cmd
        working-directory: web
        run: npm test

      - name: Check - build
        shell: cmd
        working-directory: web
        run: npm run build

      - name: Stage, deploy, smoke-test, and rollback on failure
        shell: powershell
        run: >-
          & "$env:GITHUB_WORKSPACE\tools\deploy-windows.ps1"
          -DeployPath "C:\inetpub\wwwroot\psm\mapsHusam"
          -ServiceName "mapsHusam"
          -SmokeUrl "http://127.0.0.1:3000/"
          -HealthUrl "http://127.0.0.1:3000/readyz"
