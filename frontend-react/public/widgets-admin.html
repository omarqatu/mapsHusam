            try {
                return JSON.parse(localStorage.getItem('map_user')) ||

                       JSON.parse(localStorage.getItem('user')) ||
                       JSON.parse(sessionStorage.getItem('user'));

            window.location.replace('/original-index.html');

            document.addEventListener('DOMContentLoaded', function () {
                document.documentElement.style.visibility = 'visible';
            });

    })();

<div class="container">

    <p class="subtitle">تعديل مباشر لكل مجموعات التحديثات الفورية، مع تسجيل حقيقي لآخر تحديث لكل مجموعة</p>

<script>
// ==========================================================================
// إعدادات عامة
// ==========================================================================
function getAdminAuthHeaders() {
    try {
        const raw = localStorage.getItem('map_user') || sessionStorage.getItem('map_user') ||
                    localStorage.getItem('user') || sessionStorage.getItem('user');
        if (raw) {
            const u = JSON.parse(raw);
            if (u.admin_token) return { 'Authorization': 'Bearer ' + u.admin_token };
        }
    } catch (e) {}
    return {};
}

function showAlert(message, type) {
    const container = document.getElementById('alert-container');
    const el = document.createElement('div');
    el.className = 'alert alert-' + (type || 'success');
    el.innerHTML = message;
    container.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.remove(); }, 5000);
}

function formatDate(dateStr) {
    if (!dateStr) return 'لا يوجد تحديث بعد';
    let normalized = String(dateStr).trim().replace(' ', 'T').replace(/(\.\d{3})\d+/, '$1');
    const d = new Date(normalized);
    if (isNaN(d.getTime())) return 'غير معروف';
    return d.toLocaleString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
}

let uidCounter = 0;
function nextUid() { return 'row-' + (++uidCounter); }

// 🆕 جعل صفوف أي جدول قابلة للسحب لإعادة الترتيب
function makeTableRowsDraggable(tbody) {
    if (!tbody) return;
    let draggedRow = null;
    tbody.querySelectorAll('tr').forEach(row => {
        row.setAttribute('draggable', 'true');
        row.style.cursor = 'grab';
        row.addEventListener('dragstart', () => {
            draggedRow = row;
            row.style.opacity = '0.4';
        });
        row.addEventListener('dragend', () => { row.style.opacity = ''; });
        row.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!draggedRow || row === draggedRow) return;
            const rect = row.getBoundingClientRect();
            const isAfter = (e.clientY - rect.top) > rect.height / 2;
            isAfter ? row.after(draggedRow) : row.before(draggedRow);
        });
    });
}

// 🆕 حفظ ترتيب حواجز الطرق بعد السحب
async function saveRoadOrder() {
    const rows = document.querySelectorAll('#panel-road_status tbody tr');
    const orderedIds = Array.from(rows).map(r => parseInt(r.dataset.featureId, 10));
    try {
        const res = await fetch('/api/admin/reorder-features', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ layer: 'road_barriers', orderedIds })
        });
        const data = await res.json();
        showAlert(data.success ? '✅ تم حفظ ترتيب الحواجز بنجاح' : '❌ ' + (data.error || 'فشل الحفظ'), data.success ? 'success' : 'error');
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// 🆕 حفظ ترتيب محطات الوقود بعد السحب
async function saveFuelOrder() {
    const rows = document.querySelectorAll('#panel-fuel_status tbody tr');
    const orderedIds = Array.from(rows).map(r => parseInt(r.dataset.featureId, 10));
    try {
        const res = await fetch('/api/admin/reorder-features', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ layer: 'fuel_stations', orderedIds })
        });
        const data = await res.json();
        showAlert(data.success ? '✅ تم حفظ ترتيب المحطات بنجاح' : '❌ ' + (data.error || 'فشل الحفظ'), data.success ? 'success' : 'error');
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// ==========================================================================
// تعريف المجموعات الست القابلة للتعديل كعناصر JSON (currency/gold/weather/fuel/transport)
// ==========================================================================

            { key: 'code',  label: 'الرمز',             placeholder: 'USD/ILS' },
            { key: 'value', label: 'القيمة (تُعرض فعلياً)', placeholder: '3.45' }
        ]
    },
    gold: {
        title: 'الذهب والمعادن النفيسة',
        icon: 'fa-gem',
        fields: [
            { key: 'id',    label: 'المعرف (ID)',      placeholder: 'gold-24' },
            { key: 'label', label: 'الاسم المعروض',     placeholder: 'ذهب عيار 24' },
            { key: 'value', label: 'القيمة (تُعرض فعلياً)', placeholder: '215.5' },
            { key: 'unit',  label: 'الوحدة',            placeholder: 'شيكل/غرام' }
        ]
    },

        { key: 'label',     label: 'اسم المدينة المعروض',    placeholder: 'رام الله' },   // 🆕
        { key: 'temp',      label: 'الحرارة °م (تُعرض فعلياً)', placeholder: '28' },
        { key: 'humidity',  label: 'الرطوبة %',              placeholder: '65' },
        { key: 'wind',      label: 'الرياح كم/س',            placeholder: '12' },

            { key: 'label', label: 'الاسم المعروض',     placeholder: 'بنزين 95' },
            { key: 'value', label: 'القيمة (تُعرض فعلياً)', placeholder: '6.85' },

        ]
    },

            { key: 'value', label: 'القيمة (تُعرض فعلياً)', placeholder: '4.5' },
            { key: 'unit',  label: 'الوحدة',            placeholder: 'شيكل' }

const DEFAULT_WEATHER_ITEMS = [
    { id: 'ramallah', label: 'رام الله', temp: 28, humidity: 65, wind: 12, condition: 'غائم جزئياً' },
    { id: 'gaza', label: 'غزة', temp: 32, humidity: 70, wind: 15, condition: 'مشمس' },
    { id: 'jerusalem', label: 'القدس', temp: 26, humidity: 60, wind: 10, condition: 'غائم' }
];

const ROAD_STOP_OPTIONS = [
    { value: '0', label: '🟢 مفتوح' },
    { value: '1', label: '🔴 مغلق' },
    { value: '2', label: '🟠 أزمة خفيفة' },
    { value: '3', label: '🟤 أزمة خانقة' },
    { value: '4', label: '🟣 تفتيش وأزمة خانقة' }
];
const FUEL_AVAIL_OPTIONS = [
    { value: '0', label: '✔️ متوفر' },
    { value: '1', label: '❌ غير متوفر' }
];

// حالة محلية: صفوف كل مجموعة JSON + قوائم المعالم
let groupsState = {};      // { currency: {items:[...rows with _uid], updated_at}, ... }
let roadBarriersState = [];
let fuelStationsState = [];
let roadStatusUpdatedAt = null;
let fuelStatusUpdatedAt = null;

// ==========================================================================
// بناء التبويبات
// ==========================================================================
const TAB_ORDER = [
    ...Object.keys(JSON_GROUPS),
    'road_status',
    'fuel_status'
];
const TAB_META = {
    ...Object.fromEntries(Object.entries(JSON_GROUPS).map(([k, v]) => [k, { title: v.title, icon: v.icon }])),
    road_status: { title: 'حالة الطرق', icon: 'fa-road' },
    fuel_status: { title: 'حالة محطات الوقود', icon: 'fa-gas-pump' }
};

function buildTabsBar() {
    const bar = document.getElementById('tabs-bar');
    bar.innerHTML = '';
    TAB_ORDER.forEach((key, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.dataset.tab = key;
        btn.innerHTML = `<i class="fas ${TAB_META[key].icon}"></i> ${TAB_META[key].title}`;
        btn.onclick = () => setActiveTab(key);
        bar.appendChild(btn);
    });
}

function setActiveTab(key) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
}

function buildPanelsSkeleton() {
    const container = document.getElementById('panels-container');
    container.innerHTML = '';
    TAB_ORDER.forEach((key, i) => {
        const panel = document.createElement('div');
        panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
        panel.id = 'panel-' + key;
        panel.innerHTML = '<div class="loading-line"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
        container.appendChild(panel);
    });
}

// ==========================================================================
// تحميل البيانات
// ==========================================================================
async function loadEverything() {
    buildTabsBar();
    buildPanelsSkeleton();

    try {
        const [adminGroupsRes, publicRes, featuresRes] = await Promise.all([
            fetch('/api/admin/widgets-data', { headers: getAdminAuthHeaders() }),
            fetch('/api/widgets-data'),
            fetch('/api/admin/road-fuel-features', { headers: getAdminAuthHeaders() })
        ]);

        const adminGroupsData = await adminGroupsRes.json();
        const publicData = await publicRes.json();
        const featuresData = await featuresRes.json();

        if (!adminGroupsData.success) throw new Error(adminGroupsData.error || 'فشل جلب المجموعات');
        if (!featuresData.success) throw new Error(featuresData.error || 'فشل جلب المعالم');

                // 🆕 [إصلاح الفراغ الأولي]: خريطة الافتراضيات لكل مجموعة - الطقس له
        // مصدر خاص (DEFAULT_WEATHER_ITEMS أعلاه)، وباقي المجموعات تُؤخذ مباشرة
        // من نفس WIDGETS_MANUAL_DATA المُحمَّل من widgets-config.js
        const DEFAULT_GROUP_ITEMS = {
            weather: DEFAULT_WEATHER_ITEMS
        };

        groupsState = {};
        Object.keys(JSON_GROUPS).forEach(key => {
            const serverGroup = adminGroupsData.groups[key] || { data: [] };
            let items = Array.isArray(serverGroup.data) ? serverGroup.data : [];

            
            if (items.length === 0) {
                const fallback = DEFAULT_GROUP_ITEMS[key] || (typeof WIDGETS_MANUAL_DATA !== 'undefined' ? WIDGETS_MANUAL_DATA[key] : null);
                if (Array.isArray(fallback)) items = fallback;
            }

            groupsState[key] = {
                updated_at: serverGroup.updated_at || null,
                items: items.map(it => ({ ...it, _uid: nextUid() }))
            };
        });

        roadBarriersState = (featuresData.roadBarriers || []).map(f => ({ ...f, _uid: nextUid() }));
        fuelStationsState = (featuresData.fuelStations || []).map(f => ({ ...f, _uid: nextUid() }));
        roadStatusUpdatedAt = publicData.road_status_updated_at || null;
        fuelStatusUpdatedAt = publicData.fuel_status_updated_at || null;

        renderAllPanels();
    } catch (err) {
        console.error(err);
        document.getElementById('panels-container').innerHTML =
            '<div class="no-data">تعذر تحميل بيانات مركز المعلومات الحية: ' + err.message + '</div>';
    }
}

function renderAllPanels() {
    Object.keys(JSON_GROUPS).forEach(renderJsonGroupPanel);
    renderRoadStatusPanel();
    renderFuelStatusPanel();
}

// ==========================================================================
// عرض/تعديل مجموعة JSON عامة (عملات/ذهب/طقس/وقود/نقل)
// ==========================================================================
function renderJsonGroupPanel(groupKey) {
    const meta = JSON_GROUPS[groupKey];
    const state = groupsState[groupKey];
    const panel = document.getElementById('panel-' + groupKey);

    const fieldsHtml = meta.fields.map(f => `<th>${f.label}</th>`).join('');

    const rowsHtml = state.items.map(item => `
        <tr data-uid="${item._uid}">
            <td style="cursor:grab; color:#999; width:30px;">⋮⋮</td>
            ${meta.fields.map(f => `
                <td>
                    <input type="text" data-field="${f.field || f.key}" placeholder="${f.placeholder || ''}"
                           value="${(item[f.key] !== undefined && item[f.key] !== null) ? String(item[f.key]).replace(/"/g, '&quot;') : ''}">
                </td>
            `).join('')}
            <td><button type="button" class="btn btn-danger btn-sm" onclick="removeJsonRow('${groupKey}', '${item._uid}')"><i class="fas fa-trash"></i></button></td>
        </tr>
    `).join('');

    panel.innerHTML = `
        <div class="panel-header">
            <h2><i class="fas ${meta.icon}"></i> ${meta.title}</h2>
            <span class="last-updated-badge" id="last-updated-${groupKey}">
                <i class="fas fa-clock"></i> آخر تحديث: ${formatDate(state.updated_at)}
            </span>
        </div>
        <p style="font-size:12px; color:#888; margin:0 0 8px;"><i class="fas fa-arrows-alt-v"></i> اسحب أيقونة ⋮⋮ لإعادة ترتيب الصفوف، ثم اضغط "حفظ تعديلات هذه المجموعة".</p>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th style="width:30px;"></th>${fieldsHtml}<th style="width:60px;">حذف</th></tr></thead>
                <tbody id="tbody-${groupKey}">${rowsHtml || ''}</tbody>
            </table>
        </div>
        ${state.items.length === 0 ? '<div class="no-data">لا توجد عناصر في هذه المجموعة بعد</div>' : ''}
        <div class="table-actions">
            <button type="button" class="btn btn-secondary" onclick="addJsonRow('${groupKey}')"><i class="fas fa-plus"></i> إضافة عنصر جديد</button>
            <button type="button" class="btn btn-success" onclick="saveJsonGroup('${groupKey}')"><i class="fas fa-save"></i> حفظ تعديلات هذه المجموعة</button>
            <button type="button" class="btn btn-primary" onclick="loadEverything()"><i class="fas fa-sync-alt"></i> تحديث القائمة</button>
        </div>
    `;
    makeTableRowsDraggable(document.getElementById('tbody-' + groupKey)); // 🆕
}

function addJsonRow(groupKey) {
    const meta = JSON_GROUPS[groupKey];
    const newItem = { _uid: nextUid() };
    meta.fields.forEach(f => { newItem[f.key] = ''; });
    groupsState[groupKey].items.push(newItem);
    renderJsonGroupPanel(groupKey);
}

function removeJsonRow(groupKey, uid) {
    groupsState[groupKey].items = groupsState[groupKey].items.filter(it => it._uid !== uid);
    renderJsonGroupPanel(groupKey);
}

async function saveJsonGroup(groupKey) {
    const meta = JSON_GROUPS[groupKey];
    const tbody = document.getElementById('tbody-' + groupKey);
    const rows = tbody ? Array.from(tbody.querySelectorAll('tr')) : [];

    const items = [];
    rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        const obj = {};
        let hasId = false;
        inputs.forEach(input => {
            const key = input.dataset.field;
            const val = input.value.trim();
            if (key === 'id' && val) hasId = true;
            if (val !== '') obj[key] = val;
        });
        if (hasId) items.push(obj);
    });

    try {
        const res = await fetch('/api/admin/widgets-data/' + groupKey, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ items })
        });
        const data = await res.json();
        if (data.success) {
            showAlert('✅ تم حفظ تعديلات "' + meta.title + '" بنجاح، وتم تحديث تاريخ آخر تحديث تلقائياً.', 'success');
            await loadEverything();
            setActiveTab(groupKey);
        } else {
            showAlert('❌ ' + (data.error || 'فشل الحفظ'), 'error');
        }
    } catch (err) {
        showAlert('❌ خطأ في الاتصال بالسيرفر: ' + err.message, 'error');
    }
}

// ==========================================================================
// حالة الطرق (حواجز) - تعديل حالة معالم موجودة فقط
// ==========================================================================
function renderRoadStatusPanel() {
    const panel = document.getElementById('panel-road_status');

    const rowsHtml = roadBarriersState.map(f => `
        <tr data-uid="${f._uid}" data-feature-id="${f.id}">
            <td style="cursor:grab; color:#999; width:30px;">⋮⋮</td>
            <td class="id-cell">${f.id}</td>
            <td class="feature-name-cell">${f.name || '—'}</td>
            <td>
                <select id="stop-select-${f._uid}">
                    ${ROAD_STOP_OPTIONS.map(o => `<option value="${o.value}" ${String(f.stop) === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
                </select>
            </td>
            <td><button type="button" class="btn btn-primary btn-sm" onclick="saveRoadBarrier(${f.id}, '${f._uid}')"><i class="fas fa-save"></i> حفظ</button></td>
        </tr>
    `).join('');

    panel.innerHTML = `
        <div class="panel-header">
            <h2><i class="fas fa-road"></i> حالة الطرق (حواجز)</h2>
            <span class="last-updated-badge"><i class="fas fa-clock"></i> آخر تحديث: ${formatDate(roadStatusUpdatedAt)}</span>
        </div>
        <p style="font-size:12.5px; color:#777; margin-bottom:10px;">
            لإضافة حاجز جديد استخدم أداة "تحرير النقاط" على الخريطة التفاعلية. اسحب ⋮⋮ لإعادة الترتيب، ثم اضغط "حفظ الترتيب".
        </p>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th style="width:30px;"></th><th style="width:80px;">ID</th><th>اسم الحاجز</th><th>الحالة</th><th style="width:100px;">حفظ</th></tr></thead>
                <tbody>${rowsHtml || ''}</tbody>
            </table>
        </div>
        ${roadBarriersState.length === 0 ? '<div class="no-data">لا توجد حواجز مسجّلة بعد</div>' : ''}
        <div class="table-actions">
            <button type="button" class="btn btn-success" onclick="saveRoadOrder()"><i class="fas fa-arrows-alt-v"></i> حفظ الترتيب</button>
            <button type="button" class="btn btn-primary" onclick="loadEverything()"><i class="fas fa-sync-alt"></i> تحديث القائمة</button>
        </div>
    `;
    makeTableRowsDraggable(panel.querySelector('tbody')); // 🆕
}

async function saveRoadBarrier(id, uid) {
    const select = document.getElementById('stop-select-' + uid);
    const stop = select.value;
    try {
        const res = await fetch('/api/admin/update-road-barrier', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ id, stop })
        });
        const data = await res.json();
        if (data.success) {
            showAlert('✅ تم تحديث حالة الحاجز بنجاح.', 'success');
            const pub = await fetch('/api/widgets-data');
            const pubData = await pub.json();
            roadStatusUpdatedAt = pubData.road_status_updated_at || roadStatusUpdatedAt;
            renderRoadStatusPanel();
            setActiveTab('road_status');
        } else {
            showAlert('❌ ' + (data.error || 'فشل التحديث'), 'error');
        }
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// ==========================================================================
// حالة محطات الوقود - تعديل توفر ديزل/بنزين95/بنزين98 لمعالم موجودة فقط
// ==========================================================================
function renderFuelStatusPanel() {
    const panel = document.getElementById('panel-fuel_status');

    function buildSelect(uid, fieldName, currentVal) {
        return `<select id="fuel-${fieldName}-${uid}">
            ${FUEL_AVAIL_OPTIONS.map(o => `<option value="${o.value}" ${String(currentVal) === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>`;
    }

    const rowsHtml = fuelStationsState.map(f => `
        <tr data-uid="${f._uid}" data-feature-id="${f.id}">
            <td style="cursor:grab; color:#999; width:30px;">⋮⋮</td>
            <td class="id-cell">${f.id}</td>
            <td class="feature-name-cell">${f.name || '—'}</td>
            <td>${buildSelect(f._uid, 'diesel', f.diesel)}</td>
            <td>${buildSelect(f._uid, 'banzen95', f.banzen95)}</td>
            <td>${buildSelect(f._uid, 'banzen98', f.banzen98)}</td>
            <td><button type="button" class="btn btn-primary btn-sm" onclick="saveFuelStation(${f.id}, '${f._uid}')"><i class="fas fa-save"></i> حفظ</button></td>
        </tr>
    `).join('');

    panel.innerHTML = `
        <div class="panel-header">
            <h2><i class="fas fa-gas-pump"></i> حالة محطات الوقود</h2>
            <span class="last-updated-badge"><i class="fas fa-clock"></i> آخر تحديث: ${formatDate(fuelStatusUpdatedAt)}</span>
        </div>
        <p style="font-size:12.5px; color:#777; margin-bottom:10px;">
            لإضافة محطة جديدة استخدم أداة "تحرير النقاط" على الخريطة التفاعلية. اسحب ⋮⋮ لإعادة الترتيب، ثم اضغط "حفظ الترتيب".
        </p>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th style="width:30px;"></th><th style="width:80px;">ID</th><th>اسم المحطة</th><th>سولار/ديزل</th><th>بنزين 95</th><th>بنزين 98</th><th style="width:100px;">حفظ</th></tr></thead>
                <tbody>${rowsHtml || ''}</tbody>
            </table>
        </div>
        ${fuelStationsState.length === 0 ? '<div class="no-data">لا توجد محطات وقود مسجّلة بعد</div>' : ''}
        <div class="table-actions">
            <button type="button" class="btn btn-success" onclick="saveFuelOrder()"><i class="fas fa-arrows-alt-v"></i> حفظ الترتيب</button>
            <button type="button" class="btn btn-primary" onclick="loadEverything()"><i class="fas fa-sync-alt"></i> تحديث القائمة</button>
        </div>
    `;
    makeTableRowsDraggable(panel.querySelector('tbody')); // 🆕
}

async function saveFuelStation(id, uid) {
    const diesel = document.getElementById('fuel-diesel-' + uid).value;
    const banzen95 = document.getElementById('fuel-banzen95-' + uid).value;
    const banzen98 = document.getElementById('fuel-banzen98-' + uid).value;
    try {
        const res = await fetch('/api/admin/update-fuel-station', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...getAdminAuthHeaders() },
            body: JSON.stringify({ id, diesel, banzen95, banzen98 })
        });
        const data = await res.json();
        if (data.success) {
            showAlert('✅ تم تحديث توفر الوقود لهذه المحطة بنجاح.', 'success');
            const pub = await fetch('/api/widgets-data');
            const pubData = await pub.json();
            fuelStatusUpdatedAt = pubData.fuel_status_updated_at || fuelStatusUpdatedAt;
            renderFuelStatusPanel();
            setActiveTab('fuel_status');
        } else {
            showAlert('❌ ' + (data.error || 'فشل التحديث'), 'error');
        }
    } catch (err) {
        showAlert('❌ خطأ في الاتصال: ' + err.message, 'error');
    }
}

// ==========================================================================
// بدء التشغيل
// ==========================================================================
loadEverything();
</script>
