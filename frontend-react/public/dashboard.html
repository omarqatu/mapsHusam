<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائيات نجاح المزودين - المشرف</title>

    <!-- 🔒 حارس الوصول: يمنع عرض الصفحة لأي شخص غير مسجل كمشرف -->
    <style id="access-guard-style">
        html { visibility: hidden; }
    </style>
    <script>
    (function () {
        function getStoredUser() {
            try {
                return JSON.parse(localStorage.getItem('map_user')) ||
                       JSON.parse(sessionStorage.getItem('map_user')) ||
                       JSON.parse(localStorage.getItem('user')) ||
                       JSON.parse(sessionStorage.getItem('user'));
            } catch (e) {
                return null;
            }
        }

        var user = getStoredUser();
        if (!user || user.role !== 'admin') {
            window.location.replace('/original-index.html');
        } else {
            document.addEventListener('DOMContentLoaded', function () {
                document.documentElement.style.visibility = 'visible';
            });
        }
    })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { width: 95%; max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 25px; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { width: 100%; padding: 15px; border-radius: 10px; }
            h1 { font-size: 20px; margin-bottom: 15px; }
        }

        /* تنسيق الجدول */
        .table-container { overflow-x: auto; border-radius: 10px; border: 1px solid #e0e0e0; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background-color: #1a73e8; color: white; padding: 15px; font-size: 14px; position: sticky; top: 0; z-index: 10; text-align: center; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-size: 13px; }
        tr:hover { background-color: #f8f9fa; }

        /* صف الفلاتر المتقدم */
        .filter-row { background-color: #f8f9fb; }
        .filter-row th { padding: 10px 5px; background-color: #f8f9fb; border-bottom: 2px solid #1a73e8; }

        .filter-group { display: flex; flex-direction: column; gap: 5px; align-items: center; }
        .filter-input, .filter-select { 
            width: 90%; 
            padding: 6px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 11px; 
            outline: none;
            transition: all 0.3s;
            background: white;
        }
        .filter-input:focus, .filter-select:focus { border-color: #1a73e8; box-shadow: 0 0 5px rgba(26,115,232,0.2); }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }

        .refresh-btn { background: #34a853; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }

        small { color: #666; font-family: monospace; font-size: 11px; }
        .no-data { padding: 40px; text-align: center; color: #999; font-style: italic; }
        .badge-count { font-weight: bold; color: #1a73e8; background: #e8f0fe; padding: 5px 15px; border-radius: 20px; }
        
        /* تلوين حالات الطلب */
        .status-badge { padding: 5px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; display: inline-block; }
        .status-success { background: #e6f4ea; color: #137333; }
        .status-pending { background: #fef7e0; color: #b06000; }
        .status-cancelled { background: #fce8e6; color: #c5221f; }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-handshake"></i> لوحة إحصائيات نجاح المزودين</h1>

    <div class="header-actions">
        <button class="refresh-btn" onclick="loadProviderSuccessStats()"><i class="fas fa-sync-alt"></i> إعادة التحميل</button>
        <button class="refresh-btn" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);" onclick="window.open('notifications-panel.html', '_blank')">
            <i class="fas fa-bell"></i> إرسال إشعار
        </button>
        <button class="refresh-btn" style="background: linear-gradient(135deg, #34a853 0%, #1e7e34 100%);" onclick="window.open('admin-users.html', '_blank')">
            <i class="fas fa-users-cog"></i> إدارة المستخدمين
        </button>
        <div id="statsInfo">
            <span id="totalInfo" class="badge-count">إجمالي السجلات: 0</span>
        </div>
    </div>

    <div class="table-container">
        <table id="logsTable">
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>اسم مزود الخدمة</th>
                    <th>رقم الجوال</th>
                    <th>الوقت والتاريخ</th>
                    <th>نوع التواصل</th>
                    <th>حالة الطلب</th>
                    <th>رسالة الإلغاء</th>
                    <th>إجراءات</th>
                </tr>
                <tr class="filter-row">
                    <th>
                        <div class="filter-group">
                            <input type="text" class="filter-input" data-col="username" placeholder="بحث باسم المستخدم...">
                            <select class="filter-select" data-col="username"><option value="">الكل</option></select>
                        </div>
                    </th>
                    <th>
                        <div class="filter-group">
                            <input type="text" class="filter-input" data-col="provider_name" placeholder="بحث بالمزود...">
                            <select class="filter-select" data-col="provider_name"><option value="">الكل</option></select>
                        </div>
                    </th>
                    <th>
                        <div class="filter-group">
                            <input type="text" class="filter-input" data-col="provider_phone" placeholder="بحث بالرقم...">
                        </div>
                    </th>
                    <th>
                        <div class="filter-group">
                            <input type="date" id="date-filter-picker" style="padding:6px; border:1px solid #ccc; border-radius:4px; font-size:11px; width:90%;">
                            <input type="text" id="date-filter-text" placeholder="يوم/شهر/سنة مثال 22/08/2026" dir="ltr" style="padding:6px; border:1px solid #ccc; border-radius:4px; font-size:11px; width:90%; text-align:center;">
                        </div>
                    </th>
                    <th>
                        <div class="filter-group">
                            <select class="filter-select" data-col="raw_contact_type">
                                <option value="">الكل</option>
                                <option value="service_request">طلب خدمة</option>
                                <option value="call">اتصال</option>
                                <option value="whatsapp">واتساب</option>
                            </select>
                        </div>
                    </th>
                    <th>
                        <div class="filter-group">
                            <select class="filter-select" data-col="status">
                                <option value="">الكل</option>
                                <option value="ناجحة">ناجحة</option>
                                <option value="معلقة">معلقة</option>
                                <option value="تم الإلغاء">تم الإلغاء</option>
                            </select>
                        </div>
                    </th>
                    <th>
                        <div class="filter-group">
                            <input type="text" class="filter-input" data-col="cancel_reason" placeholder="بحث بالسبب...">
                            <select class="filter-select" data-col="cancel_reason"><option value="">الكل</option></select>
                        </div>
                    </th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="logsBody">
                <tr><td colspan="8" class="no-data">جارٍ التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let allData = [];

    async function loadProviderSuccessStats() {
        const tbody = document.getElementById('logsBody');
        tbody.innerHTML = '<tr><td colspan="8" class="no-data">جارٍ التحميل...</td></tr>';

        try {
            const res = await fetch('/api/admin/provider-success-stats', { 
                headers: getAdminAuthHeadersForDashboard() 
            });
            const data = await res.json();

            const rawStats = Array.isArray(data) ? data : (data.stats || data.data || []);

            if (!rawStats || rawStats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">لا توجد بيانات مسجّلة بعد.</td></tr>';
                document.getElementById('totalInfo').innerText = 'إجمالي السجلات: 0';
                return;
            }

            allData = rawStats.map(row => {
                let mappedStatus = 'معلقة';
                const dbStatus = (row.status || '').toLowerCase();
                if (dbStatus === 'completed' || dbStatus === 'success' || dbStatus === 'ناجحة') {
                    mappedStatus = 'ناجحة';
                } else if (dbStatus === 'cancelled' || dbStatus === 'rejected' || dbStatus === 'تم الإلغاء') {
                    mappedStatus = 'تم الإلغاء';
                } else if (dbStatus === 'accepted' || dbStatus === 'pending') {
                    mappedStatus = 'معلقة';
                }

                // تحويل نوع التواصل - نحتفظ بالقيمة الخام (إنجليزية) لأغراض الفلترة، مع
                // النص العربي المترجم لأغراض العرض فقط، حتى لا يتعارض الفلتر مع نص العرض
                const rawContactType = (row.contact_type || '').toLowerCase().trim();
                let contactTypeText = 'طلب خدمة';
                if (rawContactType === 'call') contactTypeText = 'اتصال';
                else if (rawContactType === 'whatsapp') contactTypeText = 'واتساب';
                else if (rawContactType === 'service_request') contactTypeText = 'طلب خدمة';

                // 🆕 التاريخ الخام (ISO) محفوظ بجانب النص المعروض، لأن فلتر التاريخ الجديد
                // يحتاج مقارنة رقمية دقيقة (يوم/شهر/سنة) وليس مقارنة نص محلي
                const rawDateValue = row.updated_at || row.created_at || row.date || null;

                return {
                    ...row,
                    username: row.username || row.user_name || row.client_name || row.full_name || '—',
                    provider_name: row.provider_name || row.provider_user_name || '—',
                    provider_phone: row.provider_phone || row.phone || row.provider_phone_number || '—',
                    raw_date: rawDateValue,
                    formatted_date: rawDateValue ? new Date(rawDateValue).toLocaleString('ar-EG') : '—',
                    contact_type: contactTypeText,
                    raw_contact_type: rawContactType || 'service_request',
                    status: mappedStatus,
                    cancel_reason: row.cancellation_reason || row.cancel_reason || row.cancellation_message || '—'
                };
            });

            updateFilterOptions(allData);
            applyFilters();
            document.getElementById('totalInfo').innerText = `إجمالي السجلات: ${allData.length}`;

        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="8" class="no-data" style="color:red;">خطأ في الاتصال بالسيرفر أو جلب البيانات</td></tr>';
        }
    }

            // 🆕 عناصر فلتر التاريخ المخصصة + دوال التطبيع والتفسير
        const dateFilterPicker = document.getElementById('date-filter-picker');
        const dateFilterText = document.getElementById('date-filter-text');

        // تحويل الأرقام العربية (٠-٩) إلى أرقام إنجليزية لقبول الكتابة بأي من اللغتين
        function normalizeDigits(str) {
            const arabicDigits = '٠١٢٣٤٥٦٧٨٩';
            return str.replace(/[٠-٩]/g, d => String(arabicDigits.indexOf(d)));
        }

        // تفسير نص مكتوب يدوياً بصيغة يوم/شهر/سنة (يقبل الفاصل /) - يرجع null إذا كانت الصيغة غير مكتملة/غير صالحة
        function parseTypedDate(text) {
            if (!text) return null;
            const cleaned = normalizeDigits(text).trim();
            const match = cleaned.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!match) return null;
            const day = parseInt(match[1], 10);
            const month = parseInt(match[2], 10);
            const year = parseInt(match[3], 10);
            if (day < 1 || day > 31 || month < 1 || month > 12) return null;
            return { day, month, year };
        }

    function updateFilterOptions(data) {
    // 🆕 توليد قوائم منسدلة ديناميكية لكل عمود يملك select[data-col] مطابق:
    // اسم المستخدم، اسم مزود الخدمة، ورسالة الإلغاء (بدل الاقتصار على عمود واحد)
    const dynamicColumns = ['username', 'provider_name', 'cancel_reason'];
    dynamicColumns.forEach(col => {
        const select = document.querySelector(`.filter-select[data-col="${col}"]`);
        if (!select) return;
        const currentValue = select.value;
        const uniqueValues = [...new Set(data.map(item => item[col]))]
            .filter(v => v && v !== '—')
            .sort();

        select.innerHTML = '<option value="">الكل</option>';
        uniqueValues.forEach(val => {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            select.appendChild(opt);
        });
        select.value = currentValue;
    });
}

    function renderTable(data) {
        const tbody = document.getElementById('logsBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="no-data">لا توجد نتائج تطابق الفلاتر المختارة</td></tr>';
            return;
        }

        data.forEach(row => {
            let statusClass = 'status-success';
            if (row.status === 'معلقة') statusClass = 'status-pending';
            if (row.status === 'تم الإلغاء') statusClass = 'status-cancelled';

            // أيقونة نوع التواصل
            let contactIcon = '📋';
            if (row.contact_type === 'اتصال') contactIcon = '📞';
            else if (row.contact_type === 'واتساب') contactIcon = '💬';
            else if (row.contact_type === 'طلب خدمة') contactIcon = '📋';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${row.username}</b></td>
                <td><b>${row.provider_name}</b></td>
                <td><small style="direction:ltr; display:inline-block;">${row.provider_phone}</small></td>
                <td>${row.formatted_date}</td>
                <td><span style="font-size:16px;">${contactIcon}</span> ${row.contact_type}</td>
                <td><span class="status-badge ${statusClass}">${row.status}</span></td>
                <td><small>${row.cancel_reason}</small></td>
                <td>
                    <button onclick="deleteRecord(${row.id})" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">
                        <i class="fas fa-trash"></i> حذف
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function applyFilters() {
    const inputs = document.querySelectorAll('.filter-input');
    const selects = document.querySelectorAll('.filter-select');
    const typedDate = parseTypedDate(dateFilterText ? dateFilterText.value : '');

    const filteredData = allData.filter(row => {
        let isMatch = true;

        inputs.forEach(input => {
            const col = input.getAttribute('data-col');
            const val = input.value.toLowerCase().trim();
            if (val) {
                const rowVal = (row[col] !== null && row[col] !== undefined) ? row[col].toString().toLowerCase() : '';
                if (!rowVal.includes(val)) isMatch = false;
            }
        });

        selects.forEach(select => {
            const col = select.getAttribute('data-col');
            const val = select.value;
            if (val) {
                const rowVal = (row[col] !== null && row[col] !== undefined) ? row[col].toString() : '';
                if (rowVal !== val) isMatch = false;
            }
        });

        // 🆕 فلتر التاريخ المخصص: مقارنة رقمية دقيقة (يوم/شهر/سنة) بالتاريخ
        // الفعلي للسجل، وليس بنص العرض المحلي، لضمان دقة تامة بغض النظر عن التنسيق
        if (typedDate) {
            if (!row.raw_date) {
                isMatch = false;
            } else {
                const rowDate = new Date(row.raw_date);
                if (
                    rowDate.getDate() !== typedDate.day ||
                    (rowDate.getMonth() + 1) !== typedDate.month ||
                    rowDate.getFullYear() !== typedDate.year
                ) {
                    isMatch = false;
                }
            }
        }

        return isMatch;
    });

    renderTable(filteredData);
}

            document.querySelectorAll('.filter-input').forEach(el => el.addEventListener('keyup', applyFilters));
            document.querySelectorAll('.filter-select').forEach(el => el.addEventListener('change', applyFilters));

            // 🆕 عند اختيار تاريخ من التقويم، نعبّئ حقل الكتابة اليدوية تلقائياً بصيغة يوم/شهر/سنة
            dateFilterPicker.addEventListener('change', () => {
                if (!dateFilterPicker.value) {
                    dateFilterText.value = '';
                    applyFilters();
                    return;
                }
                const [y, m, d] = dateFilterPicker.value.split('-');
                dateFilterText.value = `${d}/${m}/${y}`;
                applyFilters();
            });

            // 🆕 عند الكتابة اليدوية، نطبّع الأرقام العربية فوراً أثناء الكتابة
            dateFilterText.addEventListener('input', () => {
                const cursorPos = dateFilterText.selectionStart;
                const normalized = normalizeDigits(dateFilterText.value);
                if (normalized !== dateFilterText.value) {
                    dateFilterText.value = normalized;
                    dateFilterText.setSelectionRange(cursorPos, cursorPos);
                }
                applyFilters();
            });

    function getAdminAuthHeadersForDashboard() {
        try {
            const raw = localStorage.getItem('map_user') || sessionStorage.getItem('map_user') ||
                        localStorage.getItem('user') || sessionStorage.getItem('user');
            if (raw) {
                const u = JSON.parse(raw);
                const uid = u.user_id || u.id;
                if (uid) return { 'x-admin-user-id': String(uid) };
            }
        } catch (e) { /* تجاهل */ }
        return {};
    }

    async function deleteRecord(recordId) {
        if (!confirm('هل أنت متأكد من حذف هذا السجل؟ هذا الإجراء لا يمكن التراجع عنه.')) {
            return;
        }

        try {
            const res = await fetch(`/api/admin/provider-success-stats/${recordId}`, {
                method: 'DELETE',
                headers: getAdminAuthHeadersForDashboard()
            });

            const data = await res.json();

            if (data.success) {
                alert('تم حذف السجل بنجاح');
                loadProviderSuccessStats(); // إعادة تحميل البيانات
            } else {
                alert('فشل الحذف: ' + (data.error || 'خطأ غير معروف'));
            }
        } catch (err) {
            alert('خطأ في الاتصال بالسيرفر');
        }
    }

    window.onload = () => loadProviderSuccessStats();
</script>
</body>
</html>
